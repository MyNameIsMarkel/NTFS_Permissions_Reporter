name: Compilar

# Cada push a main compila el .exe en Windows y lo publica en Releases.
# La versión se toma de AssemblyVersion en src/Program.cs: si cambias la versión
# se crea una release nueva; si no, se actualiza el .exe de la release existente.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar con csc.exe (.NET Framework 4.x)
        shell: cmd
        run: build.bat /ci

      - name: Subir el ejecutable como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NtfsPermissionsReporter
          path: dist/NtfsPermissionsReporter.exe

      - name: Publicar en Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path src/Program.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)' | Select-Object -First 1
          $tag = "v{0}.{1}.{2}" -f $m.Matches[0].Groups[1].Value, $m.Matches[0].Groups[2].Value, $m.Matches[0].Groups[3].Value
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Actualizando el ejecutable de la release $tag"
            gh release upload $tag dist/NtfsPermissionsReporter.exe --clobber
          } else {
            Write-Host "Creando la release $tag"
            gh release create $tag dist/NtfsPermissionsReporter.exe --target "${{ github.sha }}" `
              --title "NTFS Permissions Reporter $tag" --generate-notes
          }
